name: Logging chain contract acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/logging-chain-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry-logging-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOGGER_SHA: 1838474e85b0655080262cfa1135434f57545881
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Fetch exact logger source
        shell: bash
        run: |
          set -euo pipefail
          git init logger-source
          git -C logger-source remote add origin https://github.com/ORESoftware/next-loggers.ts.git
          git -C logger-source fetch --no-tags --depth=1 origin "$LOGGER_SHA"
          test "$(git -C logger-source rev-parse FETCH_HEAD)" = "$LOGGER_SHA"
          git -C logger-source checkout --detach "$LOGGER_SHA"
      - name: Build ESLint/runtime surfaces without lifecycle scripts
        working-directory: logger-source
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/tsc -p tsconfig.build.json
      - name: Verify chat telemetry logging contract
        working-directory: logger-source
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { Linter } from 'eslint';
          import eslintPlugin from './dist/eslint-plugin.js';
          import { createLogger } from './dist/base-logger.js';

          const lint = (code) => new Linter().verify(code, [{
            languageOptions: { ecmaVersion: 'latest', sourceType: 'module' },
            plugins: { 'next-loggers': eslintPlugin },
            rules: { 'next-loggers/require-observability-chain': 'error' },
          }], { filename: 'chat-telemetry.mjs' });

          assert.deepEqual(lint(`
            import { createLogger } from '@oresoftware/next-loggers';
            const log = createLogger();
            const routineId = 'ores-routine-ChatRedact_9Q7mX2vN5zL';
            log.error('redacted telemetry')
              .addTraceId('ores-trace-ChatRedact_4kP8nR2sW6yT')
              .addRoutineId(routineId)
              .send();
          `), []);

          const invalid = lint(`
            import { logger } from '@oresoftware/next-loggers';
            logger.warn('missing static markers').send();
          `);
          assert.equal(invalid.length, 1);
          assert.match(invalid[0].message, /ores-trace/);
          assert.match(invalid[0].message, /routineId/);

          const records = [];
          const log = createLogger({ console: false, transports: { write: (record) => records.push(record) } });
          const routineId = 'ores-routine-ChatRuntime_3mK7pT2xV9qR';
          await log.info('telemetry record')
            .addTraceId('ores-trace-ChatRuntime_8vM3qL7nP2xK')
            .addRoutineId(routineId)
            .send();
          assert.equal(records[0].traceId, 'ores-trace-ChatRuntime_8vM3qL7nP2xK');
          assert.equal(records[0].routineId, routineId);
          NODE
